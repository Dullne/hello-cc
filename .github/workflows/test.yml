name: Test

on:
  push:
    branches:
      - master
      - codex/dsh-stable-source
      - codex/dsh-stable-fixes
      - codex/web-workbench-*
      - codex/dsh-macos-boot-identity
      - codex/dsh-stop-diagnostics
      - codex/dsh-stop-confirmation
      - 'codex/local-change-integration-*'
      - 'codex/native-remaining-fixes-*'
      - 'codex/windows-native-support*'
  pull_request:

permissions:
  contents: read

jobs:
  windows-native:
    name: Native Windows x64 acceptance
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # Isolating HOME does not isolate HKCU\Environment. Automatic setup must
      # never change the runner account's persistent PATH during runtime tests.
      HCC_SKIP_SHIM_INSTALL: '1'
      NODE_NO_WARNINGS: '1'
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci

      - name: Prepare matching Node headers and import library
        run: |
          $nodeVersion = node -p "process.version"
          $nativeToolchain = Join-Path $env:RUNNER_TEMP 'hcc-windows-toolchain'
          New-Item -ItemType Directory -Path $nativeToolchain -Force | Out-Null
          $distribution = "https://nodejs.org/dist/$nodeVersion"
          $headersName = "node-$nodeVersion-headers.tar.gz"
          Invoke-WebRequest "$distribution/SHASUMS256.txt" -OutFile (Join-Path $nativeToolchain 'SHASUMS256.txt')
          Invoke-WebRequest "$distribution/$headersName" -OutFile (Join-Path $nativeToolchain $headersName)
          Invoke-WebRequest "$distribution/win-x64/node.lib" -OutFile (Join-Path $nativeToolchain 'node.lib')
          $checksums = @{}
          Get-Content (Join-Path $nativeToolchain 'SHASUMS256.txt') | ForEach-Object {
            $parts = $_ -split '\s+', 2
            if ($parts.Length -eq 2) { $checksums[$parts[1].TrimStart('*')] = $parts[0] }
          }
          foreach ($entry in @(@{File=$headersName; Distribution=$headersName}, @{File='node.lib'; Distribution='win-x64/node.lib'})) {
            $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $nativeToolchain $entry.File)).Hash
            if (!$checksums.ContainsKey($entry.Distribution) -or $actual -ine $checksums[$entry.Distribution]) { throw "Node distribution checksum mismatch: $($entry.File)" }
          }
          tar.exe -xf (Join-Path $nativeToolchain $headersName) -C $nativeToolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "HCC_NODE_HEADERS=$(Join-Path $nativeToolchain "node-$nodeVersion\include\node")" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HCC_NODE_LIBRARY=$(Join-Path $nativeToolchain 'node.lib')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build native Windows filesystem, process, terminal, and launcher components
        run: |
          node scripts/build-windows-native.mjs --headers "$env:HCC_NODE_HEADERS" --node-lib "$env:HCC_NODE_LIBRARY"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node -p "JSON.stringify({node:process.version,arch:process.arch,platform:process.platform})"
          [Environment]::OSVersion.VersionString

      - name: Isolate test profile beneath the runner's owned home
        run: |
          $testProfile = Join-Path $env:USERPROFILE ('hcc-windows-test-' + [Guid]::NewGuid().ToString())
          New-Item -ItemType Directory -Path $testProfile | Out-Null
          "HOME=$testProfile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "USERPROFILE=$testProfile" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify actual Windows contracts and extracted npm candidate
        id: windows_tests
        run: |
          node --test --test-concurrency=1 test/windows-*.test.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/hcc-windows-native.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify shared UI behavior and source checks
        run: |
          node --test test/web-ui-agent-start.test.mjs test/web-ui-session-display.test.mjs test/web-ui-handoff.test.mjs test/web-ui-terminal-command.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:audit
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify shared native services, scoped tools, and Web behavior
        timeout-minutes: 40
        run: |
          node --test --test-concurrency=3 test/native-runtime.test.mjs test/web-native-sessions.test.mjs test/web-structured-routes.test.mjs test/scoped-mcp.test.mjs test/native-fixture-root.test.mjs test/codex-terminal-history-boundary.test.mjs test/web-browser-lifecycle.test.mjs test/web-files-platform.test.mjs 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/hcc-windows-shared.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify an independently installed npm candidate
        timeout-minutes: 10
        run: node scripts/windows-installed-acceptance.mjs --output .superpowers/windows-installed-acceptance.json

      - name: Upload Windows acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hcc-windows-native.log
            ${{ runner.temp }}/hcc-windows-shared.log
            native/bin/win32-x64/hcc-windows.json
            native/bin/win32-x64/hcc-shim.json
            .superpowers/windows-installed-acceptance.json
          if-no-files-found: warn
          retention-days: 14

  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install tmux on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install dependencies
        run: npm ci

      - name: Build and verify native cwd handoff helpers
        run: |
          npm run build:native:cwd-handoff
          npm run release:native:verify

      - name: Create a private home for runtime tests
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          const home = fs.mkdtempSync('/tmp/hcc-test-home-');
          assert.equal(fs.lstatSync(home).mode & 0o777, 0o700);
          fs.appendFileSync(process.env.GITHUB_ENV, 'HCC_TEST_HOME=' + fs.realpathSync(home) + '\n');
          NODE

      - name: Verify install and PTY contract
        run: |
          node --test test/release-contract.test.mjs
          node --test --test-name-pattern='captures a complete real PTY identity' test/process-identity.test.mjs

      - name: Smoke test
        run: npm run smoke

      - name: Check release notes
        run: npm run release:check

      - name: Regression test
        id: regression
        run: |
          set -o pipefail
          HOME="$HCC_TEST_HOME" npm test 2>&1 | tee "$RUNNER_TEMP/hcc-regression.log"

      - name: Verify isolated different-UID filesystem behavior on Linux
        id: cross_uid
        if: runner.os == 'Linux'
        run: |
          set -o pipefail
          sudo "$(command -v node)" --test test/pinned-cwd-cross-uid.test.mjs 2>&1 | tee "$RUNNER_TEMP/hcc-cross-uid.log"

      - name: Annotate failed Node tests
        if: failure() && (steps.regression.outcome == 'failure' || steps.cross_uid.outcome == 'failure')
        env:
          HCC_REGRESSION_OUTCOME: ${{ steps.regression.outcome }}
          HCC_CROSS_UID_OUTCOME: ${{ steps.cross_uid.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { taskDispatchFailureDiagnostics } from './.github/scripts/task-dispatch-diagnostics.mjs';
          const escape = value => value.replace(/%/g, '%25').replace(/\r/g, '%0D').replace(/\n/g, '%0A');
          const checks = [
            { name: 'Regression test', outcome: process.env.HCC_REGRESSION_OUTCOME, file: 'hcc-regression.log' },
            { name: 'Different-UID test', outcome: process.env.HCC_CROSS_UID_OUTCOME, file: 'hcc-cross-uid.log' }
          ];
          for (const check of checks.filter(check => check.outcome === 'failure')) {
            const log = path.join(process.env.RUNNER_TEMP, check.file);
            let summary = check.name + ' failed; inspect the uploaded log for details.';
            if (fs.existsSync(log)) {
              const file = fs.openSync(log, 'r');
              try {
                const size = fs.fstatSync(file).size;
                const bytes = Buffer.alloc(Math.min(size, 256 * 1024));
                fs.readSync(file, bytes, 0, bytes.length, Math.max(0, size - bytes.length));
                const logText = bytes.toString('utf8').replace(/\u001b\[[0-?]*[ -/]*[@-~]/g, '');
                const lines = logText.split(/\r?\n/);
                // Publish only test names, source locations and result counts;
                // raw errors, arguments and env stay out.
                const selected = lines.filter(line =>
                  (/^\s*(?:✖|not ok\s+\d+(?:\s+-)?)(?:\s|$)/.test(line) && !/failing tests:/.test(line)) ||
                  /^test at test\/[A-Za-z0-9_./-]+:\d+:\d+$/.test(line) ||
                  /^(?:#|ℹ) (?:tests|pass|fail|cancelled|skipped|todo|duration_ms) \d/.test(line)
                ).map(line => line.trim().replace(/[\x00-\x1f\x7f]/g, '').slice(0, 350));
                const details = [...new Set(selected)].slice(-24).join('\n').slice(0, 6000);
                if (details) summary += '\n' + details;
                // Exact dispatch assertion markers opt into a fixed boolean/
                // enum summary; task text, IDs and the raw JSON stay private.
                for (const result of taskDispatchFailureDiagnostics(logText)) {
                  summary += '\nTask dispatch result: ' + JSON.stringify(result);
                }
              } finally { fs.closeSync(file); }
            }
            process.stdout.write('::error title=' + check.name + ' failure::' + escape(summary) + '\n');
          }
          NODE

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/hcc-regression.log
            ${{ runner.temp }}/hcc-cross-uid.log
          if-no-files-found: warn
          retention-days: 14
