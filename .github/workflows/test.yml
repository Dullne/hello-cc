name: Test

on:
  push:
    branches:
      - master
      - codex/dsh-stable-source
      - codex/dsh-stable-fixes
      - codex/web-workbench-*
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    name: Regression (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install tmux on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y tmux

      - name: Install tmux on macOS
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: Install dependencies
        run: npm ci

      - name: Verify install and PTY contract
        run: |
          node --test test/release-contract.test.mjs
          node --test --test-name-pattern='captures a complete real PTY identity' test/process-identity.test.mjs

      - name: Smoke test
        run: npm run smoke

      - name: Check release notes
        run: npm run release:check

      - name: Regression test
        run: |
          set -o pipefail
          npm test 2>&1 | tee "$RUNNER_TEMP/hcc-regression.log"

      - name: Verify isolated different-UID filesystem behavior on Linux
        if: runner.os == 'Linux'
        run: sudo "$(command -v node)" --test test/pinned-cwd-cross-uid.test.mjs

      - name: Upload regression log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/hcc-regression.log
          if-no-files-found: warn
          retention-days: 14
