name: DeepSeek Harness package acceptance

on:
  push:
    branches:
      - master
      - codex/dsh-stable-source
      - codex/dsh-stable-fixes
      - 'codex/web-workbench-*'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Verify a checkout candidate or the matching immutable release archive'
        type: choice
        required: true
        default: release
        options:
          - release
          - candidate

permissions:
  contents: read

jobs:
  installed-acceptance:
    name: Installed Harness (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    env:
      DSH_TELEMETRY_DISABLED: '1'
      HCC_DSH_DISPATCH_MODE: ${{ inputs.mode }}

    steps:
      - name: Set isolated acceptance directory
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          // Runner work directories can have ancestry owned by a different
          // service UID. Keep private HOME/bootstrap state under sticky /tmp.
          const directory = fs.mkdtempSync('/tmp/hcc-dsh-acceptance-');
          fs.chmodSync(directory, 0o700);
          const root = fs.realpathSync(directory);
          fs.appendFileSync(process.env.GITHUB_ENV, `HCC_DSH_ACCEPTANCE_ROOT=${root}\n`);
          NODE

      - name: Checkout selected revision
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Pin npm packaging version
        run: npm install --global npm@11.17.0 --no-audit --no-fund

      - name: Freeze selected package and record candidate or release provenance
        id: package
        run: node scripts/dsh-package-provenance.mjs

      - name: Install pinned official Harness and pnpm
        id: install
        timeout-minutes: 25
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee "$HCC_DSH_ACCEPTANCE_ROOT/evidence/official-install.log"
          import assert from 'node:assert/strict';
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = process.env.HCC_DSH_ACCEPTANCE_ROOT;
          const env = { ...process.env, HOME: path.join(root, 'home'),
            DSH_HOME: path.join(root, 'home', 'dsh'),
            NPM_CONFIG_CACHE: path.join(root, 'npm-cache'),
            NPM_CONFIG_USERCONFIG: path.join(root, 'home', '.npmrc') };
          for (const key of ['DEEPSEEK_API_KEY', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY']) delete env[key];
          const result = spawnSync('npm', ['install', '--prefix', path.join(root, 'official'),
            '--save-exact', '--no-audit', '--no-fund', '--fetch-retries=1', '--fetch-timeout=120000',
            '@deepseek-ai/dsh@0.2.0-rc.2', 'pnpm@12.8.1'], { env, stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exitCode = result.status ?? 1;
          if (result.status === 0) {
            const versions = {};
            for (const [name, expected] of [['@deepseek-ai/dsh', '0.2.0-rc.2'], ['pnpm', '12.8.1']]) {
              const manifest = JSON.parse(fs.readFileSync(path.join(root, 'official', 'node_modules', name, 'package.json')));
              assert.equal(manifest.version, expected, `Unexpected installed ${name} version`);
              versions[name] = manifest.version;
            }
            fs.writeFileSync(path.join(root, 'evidence', 'official-versions.json'), JSON.stringify(versions, null, 2) + '\n');
            console.log(JSON.stringify(versions));
          }
          NODE

      - name: Verify selected package with the installed public CLI
        id: acceptance
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE' 2>&1 | tee "$HCC_DSH_ACCEPTANCE_ROOT/evidence/installed-acceptance.log"
          import fs from 'node:fs';
          import path from 'node:path';
          import { spawnSync } from 'node:child_process';
          const root = process.env.HCC_DSH_ACCEPTANCE_ROOT;
          const official = path.join(root, 'official');
          const unpacked = path.join(root, 'unpacked', 'package');
          const { tarball } = JSON.parse(fs.readFileSync(path.join(root, 'candidate.json')));
          const env = { ...process.env, HOME: path.join(root, 'home'),
            DSH_HOME: path.join(root, 'home', 'dsh'),
            NPM_CONFIG_CACHE: path.join(root, 'npm-cache'),
            NPM_CONFIG_USERCONFIG: path.join(root, 'home', '.npmrc'),
            PATH: [path.dirname(process.execPath), path.join(official, 'node_modules', '.bin'),
              process.env.PATH || ''].join(path.delimiter) };
          for (const key of ['DEEPSEEK_API_KEY', 'OPENAI_API_KEY', 'ANTHROPIC_API_KEY']) delete env[key];
          // Both the script and its source-hash baseline come from the selected
          // candidate or immutable release, exactly matching the installed tgz.
          const result = spawnSync(process.execPath, [path.join(unpacked, 'scripts', 'dsh-installed-acceptance.mjs'),
            official, '--tarball', tarball, '--output-dir', path.join(root, 'evidence', 'installed'),
            '--npm-cache', path.join(root, 'npm-cache'), '--pnpm-store', path.join(root, 'pnpm-store')],
            { cwd: unpacked, env, stdio: 'inherit' });
          if (result.error) throw result.error;
          process.exitCode = result.status ?? 1;
          NODE

      - name: Report bounded installation failure details
        if: failure()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import { redactSecrets } from './lib/shared/redact.mjs';
          const evidence = path.join(process.env.HCC_DSH_ACCEPTANCE_ROOT, 'evidence');
          const receiptFile = path.join(evidence, 'installed', 'dsh-installed-receipt.json');
          if (fs.existsSync(receiptFile)) {
            const receipt = JSON.parse(fs.readFileSync(receiptFile, 'utf8'));
            const text = JSON.stringify(redactSecrets({ failure: receipt.failure, completedChecks: receipt.checks?.length })).slice(-6000);
            console.log('::error title=Installed Harness failure::' + text.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A'));
          }
          for (const name of ['official-install.log', 'installed-acceptance.log']) {
            const file = path.join(evidence, name);
            if (!fs.existsSync(file)) continue;
            const text = redactSecrets(fs.readFileSync(file, 'utf8').split('\n').slice(-60).join('\n')).slice(-6000);
            const escaped = text.replaceAll('%', '%25').replaceAll('\r', '%0D').replaceAll('\n', '%0A');
            console.log(`::error title=${name}::${escaped}`);
          }
          NODE

      - name: Record workflow outcome
        if: always()
        shell: bash
        env:
          HCC_PACKAGE_OUTCOME: ${{ steps.package.outcome }}
          HCC_ACCEPTANCE_MODE: ${{ steps.package.outputs.mode }}
          HCC_ACCEPTANCE_TARGET: ${{ steps.package.outputs.acceptanceTarget }}
          HCC_INSTALL_OUTCOME: ${{ steps.install.outcome }}
          HCC_ACCEPTANCE_OUTCOME: ${{ steps.acceptance.outcome }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          const evidence = path.join(process.env.HCC_DSH_ACCEPTANCE_ROOT, 'evidence');
          fs.mkdirSync(evidence, { recursive: true });
          fs.writeFileSync(path.join(evidence, 'workflow-outcome.json'), JSON.stringify({
            completedAt: new Date().toISOString(),
            platform: { os: process.platform, architecture: process.arch, node: process.version },
            package: process.env.HCC_PACKAGE_OUTCOME,
            acceptanceMode: process.env.HCC_ACCEPTANCE_MODE || null,
            acceptanceTarget: process.env.HCC_ACCEPTANCE_TARGET || null,
            officialInstall: process.env.HCC_INSTALL_OUTCOME,
            installedAcceptance: process.env.HCC_ACCEPTANCE_OUTCOME,
            modelCallsRequested: false, npmPublicationRequested: false,
            scope: 'CI runner only; no employee-device or genuine business acceptance'
          }, null, 2) + '\n');
          NODE

      - name: Upload platform receipt and acceptance logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dsh-acceptance-${{ steps.package.outputs.mode || 'unprepared' }}-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.HCC_DSH_ACCEPTANCE_ROOT }}/evidence/
          if-no-files-found: error
          retention-days: 14
